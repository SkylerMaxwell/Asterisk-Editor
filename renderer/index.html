<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;">
<title>Asterisk</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="board"></canvas>
<div id="overlay"></div>

<div id="titlebar">
  <div class="tb-left">
    <div class="logo" title="Asterisk">
      <svg viewBox="0 0 24 24" width="18" height="18"><g stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M12 3.6v16.8"/><path d="M4.7 7.8l14.6 8.4"/><path d="M19.3 7.8L4.7 16.2"/></g></svg>
    </div>
    <span class="tb-sep"></span>
    <div class="btn-group" role="group" aria-label="File">
      <button id="btn-open" class="tb-btn" title="Open project (Ctrl+O)">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4.2l2 2.2h8.8A1.5 1.5 0 0 1 21 9.7V17a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
        <span>Open</span>
      </button>
      <button id="btn-save" class="tb-btn" title="Save project (Ctrl+S) &middot; Save as (Ctrl+Shift+S)">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M5 4.5h11l3.5 3.5V19a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 19V6A1.5 1.5 0 0 1 5 4.5z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M7.5 4.5v4.5h7V4.5M7.5 20.5v-6h9v6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
        <span>Save</span>
        <i id="dirty-dot" class="dirty-dot" hidden></i>
      </button>
      <button id="btn-export" class="tb-btn" title="Export as PNG image (Ctrl+E)">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 15V4.5M7.8 8.5L12 4.3l4.2 4.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 14v4.2a1.3 1.3 0 0 0 1.3 1.3h12.4a1.3 1.3 0 0 0 1.3-1.3V14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
        <span>Export</span>
      </button>
    </div>
    <div class="btn-group single" role="group" aria-label="Board">
      <button id="btn-clear" class="tb-btn danger" title="Clear the board">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4.5 7h15M9.5 7V5A1 1 0 0 1 10.5 4h3a1 1 0 0 1 1 1v2M6.5 7l.8 11.2A1.5 1.5 0 0 0 8.8 19.5h6.4a1.5 1.5 0 0 0 1.5-1.3L17.5 7M10.2 11v5M13.8 11v5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Clear</span>
      </button>
    </div>
    <button id="btn-theme" class="icon-btn" title="Toggle theme"></button>
  </div>
  <div class="tb-title"><span id="doc-name">Untitled</span><i id="title-dot" class="dirty-dot" hidden></i><span class="tb-app">&nbsp;&middot;&nbsp;Asterisk</span></div>
  <div class="tb-right">
    <button id="win-min" class="win-btn" title="Minimize">
      <svg viewBox="0 0 10 10" width="10" height="10"><line x1="1" y1="5" x2="9" y2="5" stroke="currentColor" stroke-width="1"/></svg>
    </button>
    <button id="win-max" class="win-btn" title="Maximize">
      <svg viewBox="0 0 10 10" width="10" height="10"><rect x="1" y="1" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1"/></svg>
    </button>
    <button id="win-close" class="win-btn close" title="Close">
      <svg viewBox="0 0 10 10" width="10" height="10"><line x1="1" y1="1" x2="9" y2="9" stroke="currentColor" stroke-width="1"/><line x1="9" y1="1" x2="1" y2="9" stroke="currentColor" stroke-width="1"/></svg>
    </button>
  </div>
</div>

<div id="toolbar">
  <button data-tool="select" title="Select (V)">
    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 3l7 17 2.5-7 7-2.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
  </button>
  <button data-tool="pen" title="Pen (P)">
    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 19l7-7-3-3-7 7-1 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M16 8l2-2 3 3-2 2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
  </button>
  <button data-tool="highlighter" title="Highlighter (H)">
    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M9 15l6-6 3 3-6 6H9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 8l2-2 3 3-2 2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
  </button>
  <button data-tool="eraser" title="Eraser (E)">
    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 19h12" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 15l7-7 4 4-4 4H9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
  </button>
  <button data-tool="shape" title="Shapes (S)">
    <svg viewBox="0 0 24 24" width="20" height="20"><rect x="4" y="5" width="16" height="14" fill="none" stroke="currentColor" stroke-width="2"/></svg>
  </button>
  <button data-tool="text" title="Text (T)">
    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M5 6h14 M12 6v13 M9 19h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <button data-tool="sticky" title="Sticky note (N)">
    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M5 5h14v9l-5 5H5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 19v-5h5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
  </button>
</div>

<div id="props">
  <div id="stab-row">
    <button id="stab-toggle" class="switch" role="switch" aria-checked="false" title="Stabilizer (A): smooths hand tremor in real time as you draw">
      <span class="switch-track"><span class="switch-thumb"></span></span>
      <span class="switch-label">Stabilizer</span>
    </button>
    <div id="stab-slider" class="slider-wrap" title="Stabilizer strength">
      <input id="stab-range" class="range" type="range" min="1" max="100" step="1" value="50" aria-label="Stabilizer strength">
      <span id="stab-value" class="stab-value">50</span>
    </div>
    <div class="divider"></div>
  </div>
  <div id="shape-row">
    <button data-shape="rect" title="Rectangle"><svg viewBox="0 0 24 24" width="18" height="18"><rect x="4" y="6" width="16" height="12" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
    <button data-shape="ellipse" title="Ellipse"><svg viewBox="0 0 24 24" width="18" height="18"><ellipse cx="12" cy="12" rx="8" ry="6" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
    <button data-shape="line" title="Line"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 19L19 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <button data-shape="arrow" title="Arrow"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 19L19 5 M13 5h6v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <div class="divider"></div>
  <div id="colors"></div>
  <div class="divider"></div>
  <div id="sizes">
    <button data-size="2" title="Thin"><span style="width:4px;height:4px"></span></button>
    <button data-size="4" class="active" title="Medium"><span style="width:7px;height:7px"></span></button>
    <button data-size="8" title="Thick"><span style="width:11px;height:11px"></span></button>
    <button data-size="14" title="Extra thick"><span style="width:15px;height:15px"></span></button>
  </div>
</div>

<div id="sticky-colors"></div>

<div id="historybar">
  <button id="btn-undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 7L4 12l5 5 M4 12h11a5 5 0 0 1 0 10h-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button id="btn-redo" title="Redo (Ctrl+Y)"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 7l5 5-5 5 M20 12H9a5 5 0 0 0 0 10h1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</div>

<div id="zoombar">
  <button id="zoom-out" title="Zoom out">&minus;</button>
  <span id="zoom-level">100%</span>
  <button id="zoom-in" title="Zoom in">+</button>
  <button id="zoom-reset" class="soft" title="Reset view">Reset</button>
</div>

<div id="modal-root" hidden></div>

<div id="toast"></div>

<script src="renderer.js"></script>
</body>
</html>
